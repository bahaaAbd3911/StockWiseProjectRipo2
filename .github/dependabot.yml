# Dependabot: once a week GitHub checks for newer versions of everything the
# project depends on and opens a pull request for each update. CI runs on the
# pull request, so a green check means the update is safe to merge.
#
# Minor and patch updates are grouped into one pull request per area to keep
# the noise down; major versions (which can break things) come one by one.
# Security fixes are proposed as soon as they are published when "Dependabot
# security updates" is on (GitHub: Settings -> Code security).

version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /Front-End
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]

  # Base images: golang and distroless (API), node and caddy (web).
  - package-ecosystem: docker
    directories:
      - /backend
      - /backend/deploy
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-images:
        update-types: [minor, patch]

# Continuous integration: every push to main, and every pull
# request, is checked before it can break the live site.
#
#   backend   gofmt, go vet, all Go tests (unit + end-to-end on a throwaway
#             PostgreSQL 18) under the race detector
#   frontend  npm ci, ESLint, production build (on Linux, so a wrong letter
#             case in an import fails here instead of on the server)
#   security  govulncheck: known vulnerabilities in Go dependencies and the
#             Go standard library actually used by the code
#   docker    both production images build and the Caddyfile is valid
#
# A red check on GitHub shows which job and step failed; click it for the log.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted (run: gofmt -w <file>):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The end-to-end tests create their own database (ecommerce_it_<time>)
      # in this throwaway server, apply every migration, and drop it again.
      - name: Tests (unit + end-to-end, race detector)
        env:
          INTEGRATION_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Front-End
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Front-End/package-lock.json

      - name: Install (exactly the locked versions)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  security:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: API image
        run: docker build -t stockwise-api:ci backend

      - name: Web image (React app + Caddy)
        run: docker build -f backend/deploy/Dockerfile.web -t stockwise-web:ci .

      - name: Caddyfile is valid
        run: >-
          docker run --rm -e ACME_EMAIL=ci@example.com
          -v "$PWD/backend/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
